[package]
name = "tokenza-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Provider contract and usage-limit readers for AI coding agents (Claude Code, Codex, Cursor, OpenCode, Command Code, Devin, Antigravity)"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
