[package]
name = "tokenza-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tokenza: a Windows tray app for AI agent usage limits"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
sys-locale = "0.3"
tiny-skia = "0.11"
tokenza-core = { path = "../../../crates/tokenza-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync"] }
getrandom = "0.3"
svgtypes = "0.16"

# Keys typed into the app live in the OS credential store; the feature picks the real backend,
# without it keyring silently falls back to an in-memory mock.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.56"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
